name: Build and deploy to VPS

on:
  push:
    branches: [main, codex/turn-udp-test, codex/email-verification, codex/email-test]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run backend tests
        run: mvn --batch-mode verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/abavava-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/abavava-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Install SSH credentials
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy production Compose files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            compose.prod.yaml .env.production.example \
            "$VPS_USER@$VPS_HOST:/opt/abavava/"

      - name: Write deployment image tags on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/abavava-api:${{ github.sha }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/abavava-web:${{ github.sha }}
        run: |
          printf 'ABV_API_IMAGE=%s\nABV_WEB_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" \
            | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              'umask 077; cat > /opt/abavava/.deploy.env'

      - name: Initialize runtime settings on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/abavava
          test -r .env.production
          test -w .deploy.env

          domain="$(sed -n 's/^ABV_DOMAIN=//p' .env.production | tr -d '\r' | tail -n 1)"
          case "$domain" in
            ''|*[!A-Za-z0-9.-]*) echo 'ABV_DOMAIN must be a hostname' >&2; exit 1 ;;
          esac

          username="$(sed -n 's/^ABV_TURN_USERNAME=//p' .deploy.env | tail -n 1)"
          credential="$(sed -n 's/^ABV_TURN_CREDENTIAL=//p' .deploy.env | tail -n 1)"
          if [ -z "$username" ]; then username="abv_$(openssl rand -hex 8)"; fi
          if [ -z "$credential" ]; then credential="$(openssl rand -hex 32)"; fi

          sed -i '/^ABV_TURN_URL=/d; /^ABV_TURN_USERNAME=/d; /^ABV_TURN_CREDENTIAL=/d' .deploy.env
          printf '\nABV_TURN_URL=turn:%s:3478?transport=udp\nABV_TURN_USERNAME=%s\nABV_TURN_CREDENTIAL=%s\n' \
            "$domain" "$username" "$credential" >> .deploy.env

          # Адреса писем с кодом подтверждения: по умолчанию выводятся из
          # ABV_DOMAIN, но значения из .env.production имеют приоритет.
          mail_from="$(sed -n 's/^ABV_MAIL_FROM=//p' .env.production | tr -d '\r' | tail -n 1)"
          mail_support="$(sed -n 's/^ABV_MAIL_SUPPORT_EMAIL=//p' .env.production | tr -d '\r' | tail -n 1)"
          mail_app_url="$(sed -n 's/^ABV_MAIL_APP_URL=//p' .env.production | tr -d '\r' | tail -n 1)"
          if [ -z "$mail_from" ]; then mail_from="no-reply@$domain"; fi
          if [ -z "$mail_support" ]; then mail_support="support@$domain"; fi
          if [ -z "$mail_app_url" ]; then mail_app_url="https://$domain"; fi
          sed -i '/^ABV_MAIL_FROM=/d; /^ABV_MAIL_SUPPORT_EMAIL=/d; /^ABV_MAIL_APP_URL=/d' .deploy.env
          printf 'ABV_MAIL_FROM=%s\nABV_MAIL_SUPPORT_EMAIL=%s\nABV_MAIL_APP_URL=%s\n' \
            "$mail_from" "$mail_support" "$mail_app_url" >> .deploy.env
          REMOTE

      - name: Open UDP TURN ports in host firewall
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          firewall_configured=0
          if command -v ufw >/dev/null 2>&1; then
            if status="$(sudo -n ufw status 2>/dev/null)"; then
              if printf '%s\n' "$status" | grep -q '^Status: active'; then
                firewall_configured=1
                if ! printf '%s\n' "$status" | grep -Fq '3478/udp'; then
                  sudo -n ufw allow 3478/udp || firewall_configured=0
                fi
                if ! printf '%s\n' "$status" | grep -Fq '49160:49200/udp'; then
                  sudo -n ufw allow 49160:49200/udp || firewall_configured=0
                fi
                if [ "$firewall_configured" -eq 1 ]; then
                  echo 'Opened UDP 3478 and UDP 49160-49200 in UFW.'
                else
                  echo 'Could not open all TURN ports in UFW; check host firewall permissions.' >&2
                fi
              fi
            fi
          fi
          if [ "$firewall_configured" -eq 0 ] && command -v firewall-cmd >/dev/null 2>&1 && sudo -n firewall-cmd --state >/dev/null 2>&1; then
            firewall_configured=1
            sudo -n firewall-cmd --permanent --query-port=3478/udp >/dev/null 2>&1 || sudo -n firewall-cmd --permanent --add-port=3478/udp || firewall_configured=0
            sudo -n firewall-cmd --permanent --query-port=49160-49200/udp >/dev/null 2>&1 || sudo -n firewall-cmd --permanent --add-port=49160-49200/udp || firewall_configured=0
            if [ "$firewall_configured" -eq 1 ]; then
              sudo -n firewall-cmd --reload
              echo 'Opened UDP 3478 and UDP 49160-49200 in firewalld.'
            else
              echo 'Could not open all TURN ports in firewalld; check host firewall permissions.' >&2
            fi
          fi
          if [ "$firewall_configured" -eq 0 ]; then
            echo 'No active UFW/firewalld found; verify the VPS and provider firewalls allow UDP 3478 and 49160-49200.'
          fi
          REMOTE

      - name: Log in to GHCR on VPS with job token
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf '%s\n%s' "$GHCR_USERNAME" "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              "umask 077; export DOCKER_CONFIG=/tmp/abavava-ghcr-$DEPLOY_ID; mkdir -p \"\$DOCKER_CONFIG\"; IFS= read -r login_user; docker login ghcr.io --username \"\$login_user\" --password-stdin"

      - name: Validate production Compose configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/abavava && docker compose --env-file .env.production --env-file .deploy.env -f compose.prod.yaml config --quiet'

      - name: Pull production images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cd /opt/abavava && DOCKER_CONFIG=/tmp/abavava-ghcr-$DEPLOY_ID docker compose --env-file .env.production --env-file .deploy.env -f compose.prod.yaml pull"

      - name: Start production stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/abavava && docker compose --env-file .env.production --env-file .deploy.env -f compose.prod.yaml up -d --remove-orphans'

      - name: Verify coturn UDP listener
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          for attempt in $(seq 1 10); do
            state="$(docker inspect --format '{{.State.Status}}' abavava-coturn-1 2>/dev/null || true)"
            if [ "$state" = running ] && ss -H -lun 'sport = :3478' | grep -q .; then
              echo 'coturn is running and listening on UDP 3478.'
              exit 0
            fi
            sleep 1
          done
          docker inspect --format 'coturn state={{.State.Status}} exit={{.State.ExitCode}}' abavava-coturn-1 >&2 || true
          docker logs --tail=40 abavava-coturn-1 >&2 || true
          exit 1
          REMOTE

      - name: Log out from GHCR on VPS
        if: always()
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "DOCKER_CONFIG=/tmp/abavava-ghcr-$DEPLOY_ID docker logout ghcr.io; rm -f /tmp/abavava-ghcr-$DEPLOY_ID/config.json; rmdir /tmp/abavava-ghcr-$DEPLOY_ID 2>/dev/null || true"
