name: abavava

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abavava
      POSTGRES_USER: abavava
      POSTGRES_PASSWORD: ${ABV_DATABASE_PASSWORD:?Set ABV_DATABASE_PASSWORD in .env.production}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abavava -d abavava"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    image: ${ABV_API_IMAGE:?Set ABV_API_IMAGE in .deploy.env}
    # Postfix живёт на хосте, api ходит в него как в host.docker.internal:25.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ABV_ENV: production
      ABV_HTTP_ADDR: 0.0.0.0:8082
      ABV_DATABASE_URL: jdbc:postgresql://postgres:5432/abavava?sslmode=disable
      ABV_DATABASE_USERNAME: abavava
      ABV_DATABASE_PASSWORD: ${ABV_DATABASE_PASSWORD:?Set ABV_DATABASE_PASSWORD in .env.production}
      ABV_JWT_SECRET: ${ABV_JWT_SECRET:?Set ABV_JWT_SECRET in .env.production}
      ABV_ALLOWED_ORIGINS: https://${ABV_DOMAIN:?Set ABV_DOMAIN in .env.production}
      ABV_MIGRATE_ON_START: "true"
      ABV_SEED: "false"
      ABV_LOG_LEVEL: ${ABV_LOG_LEVEL:-info}
      ABV_TURN_URL: ${ABV_TURN_URL:-}
      ABV_TURN_USERNAME: ${ABV_TURN_USERNAME:-}
      ABV_TURN_CREDENTIAL: ${ABV_TURN_CREDENTIAL:-}
      # Транзакционная почта (коды подтверждения). From и App URL обязательны:
      # без них письмо уйдёт с локального домена и в ссылке будет localhost.
      ABV_MAIL_ENABLED: ${ABV_MAIL_ENABLED:-true}
      ABV_MAIL_HOST: ${ABV_MAIL_HOST:-host.docker.internal}
      ABV_MAIL_PORT: ${ABV_MAIL_PORT:-25}
      ABV_MAIL_USERNAME: ${ABV_MAIL_USERNAME:-}
      ABV_MAIL_PASSWORD: ${ABV_MAIL_PASSWORD:-}
      ABV_MAIL_STARTTLS: ${ABV_MAIL_STARTTLS:-false}
      ABV_MAIL_SSL: ${ABV_MAIL_SSL:-false}
      ABV_MAIL_FROM: ${ABV_MAIL_FROM:?Set ABV_MAIL_FROM in .env.production}
      ABV_MAIL_SUPPORT_EMAIL: ${ABV_MAIL_SUPPORT_EMAIL:?Set ABV_MAIL_SUPPORT_EMAIL in .env.production}
      ABV_MAIL_APP_URL: ${ABV_MAIL_APP_URL:?Set ABV_MAIL_APP_URL in .env.production}
      # POST /auth/send-code: dev → в production выключен (404), on → публично.
      ABV_EMAILVERIFICATION_SENDCODE: ${ABV_EMAILVERIFICATION_SENDCODE:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8082"
    ports:
      - "127.0.0.1:18082:8082"
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.19.0-r0
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --no-tcp
      - --no-tls
      - --no-tcp-relay
      - --lt-cred-mech
      - --fingerprint
      - --realm=${ABV_DOMAIN:?Set ABV_DOMAIN in .env.production}
      - --user=${ABV_TURN_USERNAME:?Set ABV_TURN_USERNAME in .env.production}:${ABV_TURN_CREDENTIAL:?Set ABV_TURN_CREDENTIAL in .env.production}
      - --min-port=49160
      - --max-port=49200
      - --user-quota=8
      - --total-quota=64
      - --no-multicast-peers
    restart: unless-stopped

  web:
    image: ${ABV_WEB_IMAGE:?Set ABV_WEB_IMAGE in .deploy.env}
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
